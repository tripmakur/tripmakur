{% extends "base.html" %}
{% block content %}

<div class="max-w-xl mx-auto bg-white shadow rounded p-6">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Authorized Company Access</h1>
    <p class="text-gray-600 mb-4">
        Enter your company name to access the flight status and analysis tools.
    </p>

    <form method="POST" action="{{ url_for('home') }}" class="space-y-4">
        <div>
            <label class="block mb-1 font-semibold">Company Name</label>
            <input type="text"
                   name="company"
                   class="border rounded w-full p-2"
                   placeholder="e.g. bruce">
        </div>

        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            Continue
        </button>
    </form>
</div>

{% endblock %}
