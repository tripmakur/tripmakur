<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>K9SAR Login</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1b33;
      --card2:#0c162b;
      --text:#eaf0ff;
      --muted:#a9b7d6;
      --border:rgba(255,255,255,.10);
      --shadow:0 20px 60px rgba(0,0,0,.45);
      --accent:#5b8cff;
      --accent2:#8b5bff;
      --danger:#ff5b6e;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(900px 600px at 20% 10%, rgba(91,140,255,.35), transparent 55%),
        radial-gradient(700px 500px at 85% 30%, rgba(139,91,255,.25), transparent 55%),
        radial-gradient(900px 700px at 50% 110%, rgba(40,255,160,.10), transparent 60%),
        var(--bg);
      color:var(--text);
      padding:20px;
    }
    .wrap{
      width:min(520px, 100%);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }
    .logo{
      width:44px; height:44px; border-radius:14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 12px 30px rgba(91,140,255,.25);
      display:grid; place-items:center;
      font-weight:800;
    }
    .brand h1{
      font-size:20px;
      margin:0;
      letter-spacing:.2px;
    }
    .brand p{ margin:2px 0 0; color:var(--muted); font-size:13px; }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:18px;
      overflow:hidden;
      position:relative;
    }
    .card:before{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(450px 160px at 20% 0%, rgba(91,140,255,.20), transparent 60%);
      pointer-events:none;
    }
    .content{ position:relative; }
    .title{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
      margin-bottom:14px;
    }
    .title h2{ margin:0; font-size:18px; }
    .title .hint{ margin:2px 0 0; color:var(--muted); font-size:13px; line-height:1.4; }
    label{ display:block; font-size:13px; color:var(--muted); margin:10px 0 6px; }
    input{
      width:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      color:var(--text);
      padding:12px 12px;
      font-size:16px;
      outline:none;
    }
    input:focus{
      border-color: rgba(91,140,255,.75);
      box-shadow: 0 0 0 4px rgba(91,140,255,.18);
    }
    .row{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      margin-top:14px;
    }
    .btn{
      width:100%;
      border:none;
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
      font-weight:700;
      color:white;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 14px 34px rgba(91,140,255,.22);
      cursor:pointer;
    }
    .btn:active{ transform: translateY(1px); }
    .error{
      margin-top:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,91,110,.35);
      background: rgba(255,91,110,.12);
      color:#ffd9de;
      font-size:14px;
    }
    .footer{
      margin-top:14px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">K9</div>
      <div>
        <h1>K9SAR</h1>
        <p>Private training & tracking log</p>
      </div>
    </div>

    <div class="card">
      <div class="content">
        <div class="title">
          <div>
            <h2>Enter Access Code</h2>
            <div class="hint">This session stays active until you close the tab/browser.</div>
          </div>
        </div>

        <form method="POST" autocomplete="off">
          <label for="code">Access Code</label>
          <input id="code" name="code" inputmode="numeric" placeholder="••••" autofocus />

          <div class="row">
            <button class="btn" type="submit">Unlock</button>
          </div>

          {% if error %}
            <div class="error">{{ error }}</div>
          {% endif %}
        </form>
      </div>
    </div>

    <div class="footer">Protected area • tripmakur.com</div>
  </div>
</body>
</html>
