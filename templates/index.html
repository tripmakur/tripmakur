{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2 class="card-title">Company Access</h2>
    <p class="card-text">Enter your company name to access the flight status system.</p>

    <form action="/" method="POST">
        <label class="form-label">Company Name</label>
        <input type="text" name="company" class="form-input" required>

        <button type="submit" class="btn-primary">Continue</button>
    </form>
</div>

{% endblock %}
