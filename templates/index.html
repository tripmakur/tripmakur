{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2 style="margin-bottom: 15px;">Enter Company Name</h2>
    <p style="margin-bottom: 10px; color: #555;">Only approved companies may access the dashboard.</p>

    <form action="{{ url_for('check_company') }}" method="POST">
        <label>Company Name</label>
        <input type="text" name="company" class="input" required>

        <br><br>
        <button type="submit" class="btn">Continue</button>
    </form>
</div>

{% endblock %}
