{% extends "base.html" %}
{% block content %}

<h1 class="text-3xl font-bold mb-6 text-gray-800">Authorized Company Access</h1>

<form method="POST" class="bg-white p-6 shadow rounded w-full max-w-md">
    <label class="font-semibold">Company Name</label>
    <input type="text" name="company" class="border rounded p-2 w-full mb-4">

    <button class="bg-blue-600 text-white px-4 py-2 rounded w-full">
        Check Flight Status
    </button>
</form>

{% endblock %}
