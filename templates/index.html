{% extends "base.html" %}
{% block content %}

<h1 class="text-3xl font-bold mb-6">Authorized Company Access</h1>

<form method="POST" class="bg-white p-6 shadow rounded w-full md:w-1/2">
    <label class="font-semibold">Company Name:</label>
    <input type="text" name="company" class="border p-2 rounded w-full mb-4" required>

    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Continue
    </button>
</form>

{% endblock %}
