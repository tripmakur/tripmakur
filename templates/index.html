{% extends "base.html" %}
{% block content %}

<h1 class="text-3xl font-bold mb-4 text-gray-800">Authorized Company Access</h1>
<p class="mb-4 text-gray-600">
    Enter your company name to access the TripMakur flight tools.
</p>

<form method="POST" class="bg-white p-6 shadow rounded max-w-md">
    <div class="mb-4">
        <label class="block mb-1 font-semibold">Company Name</label>
        <input type="text" name="company" class="border p-2 rounded w-full" required />
    </div>
    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Check Flight Status
    </button>
</form>

{% endblock %}
