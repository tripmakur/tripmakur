{% if status == "Arrived" %}
    <span class="px-2 py-1 bg-green-600 text-white rounded text-sm">{{ status }}</span>

{% elif status == "Delayed" %}
    <span class="px-2 py-1 bg-yellow-500 text-white rounded text-sm">{{ status }}</span>

{% elif status == "Departed" %}
    <span class="px-2 py-1 bg-blue-600 text-white rounded text-sm">{{ status }}</span>

{% elif status == "Cancelled" %}
    <span class="px-2 py-1 bg-red-600 text-white rounded text-sm">{{ status }}</span>

{% elif status == "Scheduled" %}
    <span class="px-2 py-1 bg-gray-600 text-white rounded text-sm">{{ status }}</span>

{% else %}
    <span class="px-2 py-1 bg-gray-800 text-white rounded text-sm">{{ status }}</span>
{% endif %}
