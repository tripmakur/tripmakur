<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K9sar Login</title>
</head>
<body style="font-family:Arial;margin:20px;">
  <h2>K9sar</h2>
  <p>Enter access code:</p>

  {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}

  <form method="POST">
    <input name="code" type="password" inputmode="numeric" autofocus
           style="padding:12px;width:260px;font-size:18px;" />
    <div style="margin-top:12px;">
      <button type="submit" style="padding:12px 16px;font-size:16px;">Enter</button>
    </div>
  </form>
</body>
</html>
