<!DOCTYPE html>
<html>
<head>
    <title>TripMakur Flight Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="nav">
    <a href="{{ url_for('home') }}">Home</a>
</div>

<div class="container">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="flash">
            {% for msg in messages %}
                <p>{{ msg }}</p>
            {% endfor %}
        </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>

    <p>© 2025 TripMakur. All rights reserved.</p>
  </footer>
</body>
</html>
