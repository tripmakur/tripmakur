<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flight Tools Dashboard</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100 text-gray-800">

    <!-- NAVBAR -->
    <nav class="bg-white shadow mb-8">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">

            <div class="text-2xl font-bold text-blue-700">
                Flight Dashboard
            </div>

            <div class="flex space-x-4">

                <!-- Flight Status -->
                <a href="{{ url_for('flight_status', company=company) }}"
                   class="px-4 py-2 rounded 
                          {% if request.endpoint == 'flight_status' %} bg-blue-700 text-white {% else %} bg-blue-600 text-white hover:bg-blue-700 {% endif %}">
                    Flight Status
                </a>

                <!-- Flight Analysis -->
                <a href="{{ url_for('flight_analysis', company=company) }}"
                   class="px-4 py-2 rounded 
                          {% if request.endpoint == 'flight_analysis' %} bg-green-700 text-white {% else %} bg-green-600 text-white hover:bg-green-700 {% endif %}">
                    Flight Analysis
                </a>

            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
