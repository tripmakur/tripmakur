{% macro status_badge(status) %}
    {% set s = status.lower() %}

    {% if "scheduled" in s %}
        <span class="px-3 py-1 rounded bg-blue-200 text-blue-800 font-semibold">Scheduled</span>

    {% elif "departed" in s %}
        <span class="px-3 py-1 rounded bg-yellow-200 text-yellow-800 font-semibold">Departed</span>

    {% elif "arrived" in s %}
        <span class="px-3 py-1 rounded bg-green-200 text-green-800 font-semibold">Arrived</span>

    {% elif "delayed" in s %}
        <span class="px-3 py-1 rounded bg-red-200 text-red-800 font-semibold">Delayed</span>

    {% elif "cancel" in s %}
        <span class="px-3 py-1 rounded bg-gray-300 text-gray-700 font-semibold">Cancelled</span>

    {% else %}
        <span class="px-3 py-1 rounded bg-gray-200 text-gray-700 font-semibold">Unknown</span>
    {% endif %}
{% endmacro %}
