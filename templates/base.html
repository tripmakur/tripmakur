<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TripMakur Flight Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="light-bg">

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-logo">✈️ TripMakur</div>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('flight_status', company=request.args.get('company')) }}">Flight Status</a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert">
                {% for msg in messages %}
                    <p>{{ msg }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
