{% macro status_badge(status) %}
    {% set s = status.lower() %}

    {% if "delayed" in s %}
        <span class="px-3 py-1 bg-yellow-500 text-white rounded">Delayed</span>
    {% elif "arrived" in s %}
        <span class="px-3 py-1 bg-green-600 text-white rounded">Arrived</span>
    {% elif "cancel" in s %}
        <span class="px-3 py-1 bg-red-600 text-white rounded">Cancelled</span>
    {% elif "departed" in s %}
        <span class="px-3 py-1 bg-blue-600 text-white rounded">Departed</span>
    {% else %}
        <span class="px-3 py-1 bg-gray-500 text-white rounded">{{ status }}</span>
    {% endif %}
{% endmacro %}
