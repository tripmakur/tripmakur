{% macro status_badge(status) %}
    {% set s = status.lower() %}

    {% if "delayed" in s %}
        <span class="px-2 py-1 bg-yellow-400 text-black rounded font-semibold">Delayed</span>

    {% elif "cancel" in s %}
        <span class="px-2 py-1 bg-red-600 text-white rounded font-semibold">Cancelled</span>

    {% elif "depart" in s %}
        <span class="px-2 py-1 bg-blue-600 text-white rounded font-semibold">Departed</span>

    {% elif "arriv" in s %}
        <span class="px-2 py-1 bg-green-600 text-white rounded font-semibold">Arrived</span>

    {% elif "scheduled" in s %}
        <span class="px-2 py-1 bg-gray-400 text-white rounded font-semibold">Scheduled</span>

    {% else %}
        <span class="px-2 py-1 bg-gray-600 text-white rounded font-semibold">{{ status }}</span>
    {% endif %}
{% endmacro %}
