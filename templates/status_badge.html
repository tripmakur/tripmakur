{% macro status_badge(status) %}
    {% set s = status.lower() %}

    {% if "delayed" in s %}
        <span class="px-2 py-1 bg-yellow-600 text-white rounded">Delayed</span>
    {% elif "arrived" in s %}
        <span class="px-2 py-1 bg-green-600 text-white rounded">Arrived</span>
    {% elif "departed" in s or "in air" in s %}
        <span class="px-2 py-1 bg-blue-600 text-white rounded">In Air</span>
    {% elif "cancel" in s %}
        <span class="px-2 py-1 bg-red-600 text-white rounded">Cancelled</span>
    {% elif "scheduled" in s %}
        <span class="px-2 py-1 bg-gray-600 text-white rounded">Scheduled</span>
    {% else %}
        <span class="px-2 py-1 bg-gray-400 text-white rounded">Unknown</span>
    {% endif %}
{% endmacro %}
