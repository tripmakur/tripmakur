{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-xl shadow">

    <h2 class="text-2xl font-bold mb-4 text-gray-800">Company Access</h2>
    <p class="text-gray-600 mb-6">Enter your company name to access the flight dashboard.</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="bg-red-100 border border-red-300 text-red-600 p-3 mb-4 rounded">
                {% for msg in messages %}
                    <p>{{ msg }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('home') }}">
        <label class="block mb-2 font-semibold">Company Name</label>
        <input type="text" name="company" class="border w-full p-3 rounded mb-4" placeholder="Enter your company..." required>

        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded">
            Continue to Dashboard
        </button>
    </form>
</div>
{% endblock %}
