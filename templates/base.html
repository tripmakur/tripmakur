<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TripMakur Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body class="bg-gray-100">

<nav class="bg-white shadow mb-6">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">

        <div class="text-2xl font-bold text-blue-600">TripMakur</div>

        {% if company %}
        <div class="space-x-6 text-lg">
            <a href="{{ url_for('flight_status', company=company) }}" class="hover:text-blue-600 font-semibold">
                Flight Status
            </a>

            <a href="{{ url_for('flight_analysis', company=company) }}" class="hover:text-blue-600 font-semibold">
                Flight Analysis
            </a>
        </div>
        {% endif %}

    </div>
</nav>

<div class="container mx-auto px-6 py-6">
    {% block content %}{% endblock %}
</div>

</body>
</html>
