<!DOCTYPE html>
<html>
<head>
    <title>TripMakur</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

<nav class="bg-white shadow mb-6 p-4">
    <div class="container mx-auto flex justify-between">
        <div class="text-xl font-bold text-blue-600">TripMakur</div>

        {% if company %}
        <div class="space-x-6 text-lg">
            <a href="{{ url_for('flight_status', company=company) }}" class="hover:text-blue-600">Flight Status</a>
            <a href="{{ url_for('flight_analysis', company=company) }}" class="hover:text-blue-600">Flight Analysis</a>
        </div>
        {% endif %}
    </div>
</nav>

<div class="container mx-auto p-6">
    {% block content %}{% endblock %}
</div>

</body>
</html>
