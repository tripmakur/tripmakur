{% macro status_badge(status) %}
    {% set s = status.lower() %}

    {% if "delayed" in s %}
        <span class="px-2 py-1 bg-yellow-500 text-white rounded text-sm">Delayed</span>

    {% elif "cancel" in s %}
        <span class="px-2 py-1 bg-red-600 text-white rounded text-sm">Cancelled</span>

    {% elif "depart" in s %}
        <span class="px-2 py-1 bg-blue-600 text-white rounded text-sm">Departed</span>

    {% elif "arriv" in s %}
        <span class="px-2 py-1 bg-green-600 text-white rounded text-sm">Arrived</span>

    {% elif "scheduled" in s %}
        <span class="px-2 py-1 bg-gray-500 text-white rounded text-sm">Scheduled</span>

    {% else %}
        <span class="px-2 py-1 bg-gray-400 text-white rounded text-sm">Unknown</span>
    {% endif %}
{% endmacro %}
