{% extends "base.html" %}
{% block content %}

<h1 class="text-3xl font-bold mb-6 text-gray-800">Authorized Company Access</h1>

<p class="text-gray-600 mb-4">Enter your company name to access tools.</p>

<form method="POST" class="max-w-md">
    <label class="block font-semibold mb-1">Company Name:</label>
    <input type="text" name="company" class="border p-2 rounded w-full mb-4">

    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Check Flight Status
    </button>
</form>

{% endblock %}
