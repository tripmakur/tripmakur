<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flight Status Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .sidebar {
            width: 260px;
        }
    </style>
</head>

<body class="bg-gray-100">

    <div class="flex">

        <!-- SIDEBAR -->
        <aside class="sidebar bg-white h-screen shadow-md fixed">
            <div class="p-6 border-b">
                <h1 class="text-2xl font-bold text-blue-600">Flight Dashboard</h1>
            </div>

            <nav class="p-4">
                <a href="{{ url_for('home') }}" class="block px-4 py-2 rounded hover:bg-blue-50">Company Login</a>
                <a href="{{ url_for('flight_status') }}" class="block px-4 py-2 rounded hover:bg-blue-50">Flight Status</a>
                <a href="{{ url_for('download_excel') }}" class="block px-4 py-2 rounded hover:bg-blue-50">Download Results</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="ml-[260px] p-8 w-full">
            {% block content %}
            {% endblock %}
        </main>

    </div>
</body>
</html>
