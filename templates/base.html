<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TripMakur Tools</title>

    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
          rel="stylesheet">
</head>

<body class="bg-gray-100">

    <!-- NAVBAR -->
    <nav class="bg-white shadow mb-6">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-blue-600">
                TripMakur
            </div>

            {% if company %}
            <div class="space-x-6 text-lg">
                <a href="{{ url_for('flight_status', company=company) }}"
                   class="hover:text-blue-600 font-semibold">
                    Flight Status
                </a>
                <a href="{{ url_for('flight_analysis', company=company) }}"
                   class="hover:text-blue-600 font-semibold">
                    Flight Analysis
                </a>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- FLASH MESSAGES -->
    <div class="container mx-auto px-6">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="mb-4">
              {% for msg in messages %}
                <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-3 mb-2">
                  {{ msg }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
    </div>

    <!-- MAIN CONTENT -->
    <div class="container mx-auto px-6 py-6">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
